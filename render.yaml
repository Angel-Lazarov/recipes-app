services:
  - type: web
    name: recipes-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: CATBOX_USERHASH
        fromSecret: CATBOX_USERHASH  # можеш да го добавиш в Render secrets

  - type: web
    name: recipes-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install
    startCommand: npm run dev
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://your-backend-url.onrender.com
